# Persian Font Reference Database
# Comprehensive catalog of 25+ Persian (Farsi) typefaces

fonts:
  - id: vazirmatn
    name: "Vazirmatn"
    css_name: "Vazirmatn"
    category: "Sans-Serif"
    subcategory: "Modern UI"
    style: "Modern geometric, low contrast"
    popularity: 5
    status: "active"
    description: "De-facto modern standard for Persian typography. Started 2015 as Vazir, renamed 2022. Default Persian font in Fedora."
    weights:
      - 100
      - 200
      - 300
      - 400
      - 500
      - 600
      - 700
      - 800
      - 900
    variable_font: true
    weight_range: "100-900"
    latin_support: true
    latin_source: "Roboto"
    arabic_support: true
    farsi_digits: true
    best_for:
      - "UI/body text"
      - "web apps"
      - "dashboards"
      - "general purpose"
      - "bilingual Persian+Latin"
    sources:
      google_fonts: "https://fonts.google.com/specimen/Vazirmatn"
      github: "https://github.com/rastikerdar/vazirmatn"
      fontsource: "https://fontsource.org/fonts/vazirmatn"
      cdn: "https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
    license: "OFL"
    commercial_free: true
    notes: "All weights other than Thin, Regular, and Black are generated by interpolation. 9 weights + variable font."

